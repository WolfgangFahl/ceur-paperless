[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceur-paperless"
description = "Paperless-ngx as fifth platform of the CEUR-WS approach comparison"
keywords = ["CEUR-WS", "Paperless-ngx", "proceedings", "metadata"]
authors = [
  { name = "Wolfgang Fahl", email = "wf@bitplan.com" }
]
maintainers = [
  { name = "Wolfgang Fahl", email = "wf@bitplan.com" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  # https://pypi.org/project/pybasemkit/
  # Python base module kit: YAML/JSON I/O, structured logging, CLI tooling
  "pybasemkit>=0.2.0",
  # https://pypi.org/project/requests/
  # Paperless-ngx REST API and ceur-spt
  "requests>=2.31.0",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
]

[project.urls]
Home = "https://github.com/WolfgangFahl/ceur-paperless"
Documentation = "https://github.com/WolfgangFahl/ceur-paperless"
Source = "https://github.com/WolfgangFahl/ceur-paperless"

[project.scripts]
ceur-paperless = "ceur_paperless.ceur_paperless_cmd:main"

[project.optional-dependencies]
test = [
  # https://pypi.org/project/pytest/
  # pytest: simple powerful testing with Python
  "pytest>=8.4.0",
]

[tool.hatch.version]
path = "ceur_paperless/__init__.py"

[tool.hatch.build.targets.wheel]
only-include = ["ceur_paperless"]

[tool.black]
line-length = 120
